[build-system]
# Pinning for maximum reproducibility, but this may be
# annoying to remember to update
requires = [
    "setuptools==80.10.2",
    "wheel==0.46.3",
    "Cython==3.1.2",
    "numpy==2.2.6"
]
build-backend = "setuptools.build_meta"

[project]
name = "vEcoli"
version = "1.1.0"
description = "Whole Cell E. coli Model"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pin numpy explicitly so an accidental ``uv pip install -e .``
    # (which BYPASSES uv.lock and resolves latest from PyPI) on a fresh
    # head can't drift past 2.2.6 into a numpy that removed np.in1d.
    # Matches the build-system requires AND uv.lock pin so all paths
    # (Docker image, MP head venv, local dev) agree on numpy version.
    "numpy==2.2.6",
    "scipy",
    "biopython",
    "cvxpy",
    "dill",
    "duckdb",
    "gcsfs",
    "pyarrow",
    "ipdb",
    "ipython",
    "line-profiler",
    "altair",
    "numba",
    "orjson",
    # Constraint can be removed once cvxpy supports newer ortools
    # than 9.12, need 9.11 to support newer protobuf (see gh-326)
    "ortools<9.11",
    "pandas",
    "polars",
    "pymunk",
    "scikit-image",
    "scikit-learn",
    "seaborn",
    "swiglpk",
    "sympy",
    "tqdm",
    "unum",
    "vivarium-core",
    "imageio[ffmpeg]",
    "statsmodels",
    "ecos",
    "matplotlib",
    "iteround",
    "stochastic-arrow",
    "autograd",
    "xmltodict",
    # Required to save Altair charts as PNG
    "vl-convert-python",
    "pandera",
    "gillespy2>=1.8.3",
    "pymc>=5.27.0",
    "arviz-plots>=0.7.0",
    "arviz>=0.23.0",
    "s3fs>=2025.5.1",
    "bigraph-schema>=1.3.3",
    "process-bigraph>=1.4.12",
]

[project.optional-dependencies]
# Minimal AWS client extras: pulled in by bootstrap_head*.sh via
# ``uv sync --frozen --extra aws`` so production heads get exactly
# boto3 + botocore[crt] from the lock — no ad-hoc ``uv pip install``.
# Kept SEPARATE from [dev] so production heads don't pull pytest /
# jupyter / etc. (and don't pull rdkit which is a 600 MB dep).
aws = [
    "boto3>=1.41.5",
    "botocore[crt]>=1.41.5",
]
# Ray is intentionally NOT in any extras here. Adding ray (even as an
# unselected extra) makes uv resolve its transitive constraints
# cross-extra, which downgrades pydantic 2.x → 1.x and adds
# opentelemetry/opencensus deps to the lock. The head never imports
# ray directly (ec2_cluster_ray.py only uses EC2SSMRayCluster from
# process-bigraph); ``import ray`` happens INSIDE the Docker image
# during the cluster experiment. Pin ray IN THE DOCKERFILE only.
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "pre-commit",
    "jupyter",
    "marimo[sql,lsp]",
    "rdkit>=2025.9.3",
    "google-cloud-billing",
    "google-cloud-compute",
    "boto3>=1.41.5",
    "botocore[crt]>=1.41.5",
]
docs = [
    "Sphinx",
    "sphinx-rtd-theme",
    "nbsphinx",
    "pre-commit"
]

# [tool.uv.sources]
# bigraph-schema = { path = "../bigraph-schema", editable = true }
# process-bigraph = { path = "../process-bigraph", editable = true }

[tool.setuptools]
packages = [
    "configs",
    "ecoli",
    "reconstruction",
    "runscripts",
    "validation",
    "wholecell"
]
